# Install as /root/apps/nginx/sites/aimo.plus/recall.conf
# Included by aimo.plus.conf. Reload only after nginx -t succeeds:
#   docker exec openresty nginx -t && docker exec openresty nginx -s reload
#
# The origin address stays on the entry host, in recall-origin.upstream.
# sites/aimo.plus/*.conf is included wholesale, so this file must not use
# the .conf suffix. See recall-origin.upstream.example.

include /root/apps/nginx/sites/aimo.plus/recall-origin.upstream;

server {
    listen 443 ssl;
    server_name recall.aimo.plus;
    charset utf-8;

    ssl_certificate     /root/apps/nginx/ssl/aimo.plus.cer;
    ssl_certificate_key /root/apps/nginx/ssl/aimo.plus.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 30m;

    client_max_body_size 2m;
    proxy_buffering off;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://recall_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
